name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # Vet, tests, the lint of every pack, and the rule that the server
      # imports the standard library only.
      - run: make check
      - run: make lint
